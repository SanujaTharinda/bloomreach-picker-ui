# ResourceSpace Docker Compose
# https://github.com/resourcespace/docker
#
# Usage:
#   1. Copy .env.example to .env and fill in secrets
#   2. Run: docker compose up --build -d
#
# This configuration connects to the existing MariaDB and filestore
# from /Users/yasas.karunarathna/Work/Brompton/sources/resourcespace

services:
  resourcespace-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resourcespace-dev
    ports:
      - "${RS_PORT:-8080}:80"
    volumes:
      # Use the SAME filestore volume as the original RS container
      - resourcespace_filestore:/var/www/html/filestore
      # Mount config.php for live editing
      - ./config/config.php:/var/www/html/include/config.php
      # Mount plugin for live editing (no rebuild needed)
      - ./plugins/featured_collection_download:/var/www/html/plugins/featured_collection_download
    networks:
      # Connect to the existing backend network where mariadb lives
      - resourcespace_backend
    environment:
      # Database
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_NAME=${DB_NAME:-resourcespace}
      - DB_USER=${DB_USER:-resourcespace_rw}
      - DB_PASSWORD=${DB_PASSWORD}
      # ResourceSpace Settings
      - RS_BASE_URL=${RS_BASE_URL:-http://localhost:8080}
      - RS_APP_NAME=${RS_APP_NAME:-ResourceSpace}
      # Security Keys (REQUIRED - from existing installation)
      - RS_SCRAMBLE_KEY=${RS_SCRAMBLE_KEY}
      - RS_API_SCRAMBLE_KEY=${RS_API_SCRAMBLE_KEY}
      # Email
      - RS_EMAIL_FROM=${RS_EMAIL_FROM:-noreply@localhost}
      - RS_EMAIL_NOTIFY=${RS_EMAIL_NOTIFY:-admin@localhost}
      # Debug (set to 'true' to enable)
      - RS_DEBUG=${RS_DEBUG:-false}
    restart: unless-stopped

networks:
  # Reference the external network from the original RS docker-compose
  resourcespace_backend:
    external: true

volumes:
  # Reference the external filestore volume from the original RS setup
  resourcespace_filestore:
    external: true
