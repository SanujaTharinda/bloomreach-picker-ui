services:
  bff:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brompton-dam-bff
    ports:
      - "5293:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # ResourceSpace API Configuration
      - ResourceSpace__BaseUrl=${RESOURCESPACE_BASE_URL:-http://host.docker.internal}
      - ResourceSpace__DefaultUser=${RESOURCESPACE_DEFAULT_USER:-admin}
      - ResourceSpace__TimeoutSeconds=${RESOURCESPACE_TIMEOUT:-30}
      # GC Configuration (default: Workstation GC for lower memory)
      # Set to 1 for Server GC (higher throughput, more memory)
      - DOTNET_gcServer=${DOTNET_GC_SERVER:-0}
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Optional: Memory limits for container
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
    #     reservations:
    #       memory: 128M

